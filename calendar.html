<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        margin: 0;
        padding: 0 0 96px 0;
        font-family: 'Roboto', sans-serif;
        background: #F4F6FB;
    }
    .header {
        padding: 24px 20px 4px 20px;
    }
    .title {
        font-family: 'LobsterFont', cursive;
        font-size: 34px;
        font-weight: bold;
        color: #17223B;
        margin: 0;
    }
    .subtitle {
        font-size: 14px;
        color: #8A93A8;
        margin: 4px 0 0 0;
    }
    .card {
        background: #FFFFFF;
        border-radius: 20px;
        margin: 18px 16px 0 16px;
        box-shadow: 0 4px 10px rgba(23,34,59,0.08);
        padding-bottom: 16px;
        overflow: hidden;
    }
    .switcher {
        display: flex;
        align-items: center;
        padding: 18px 10px 0 10px;
    }
    .switch-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #17223B;
        font-size: 20px;
        user-select: none;
    }
    .switch-btn:active { background: rgba(23,34,59,0.08); }
    .switch-btn.disabled { opacity: 0.3; pointer-events: none; }
    .month-label {
        flex: 1;
        text-align: center;
        font-family: 'LobsterFont', cursive;
        font-size: 19px;
        font-weight: bold;
        color: #17223B;
    }
    .weekdays {
        display: flex;
        padding: 16px 16px 0 16px;
    }
    .weekday {
        flex: 1;
        text-align: center;
        font-size: 12px;
        font-weight: bold;
        color: #8A93A8;
    }
    .weekday.sat { color: #E53946; }
    .weekday.sun { color: #E53946; }
    .grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        padding: 6px 8px 0 8px;
        row-gap: 4px;
    }
    .cell {
        position: relative;
        height: 52px;
        margin: 2px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F4F6FB;
        border: 1px solid #17223B22;
        font-size: 14px;
        font-weight: bold;
        color: #17223B;
    }
    .cell.empty { background: transparent; border: none; }
    .cell.today { background: #4C8DFF; border-color: #4C8DFF; color: #FFFFFF; }
    .cell.weekend-holiday:not(.today) { background: #F4F6FB; border-color: #E53946; color: #E53946; }
    .eng-date {
        position: absolute;
        bottom: 3px;
        right: 5px;
        font-size: 9px;
        font-weight: normal;
        color: #8A93A8;
    }
    .cell.today .eng-date, .cell.weekend-holiday .eng-date { color: inherit; opacity: 0.85; }
    .cell.festival-day:not(.today) { background: #FDF1F1; border-color: #B00020; color: #B00020; }
    .cell.festival-day .eng-date { color: inherit; opacity: 0.85; }
    .loading-text {
        font-size: 13px;
        color: #8A93A8;
        padding: 20px;
        text-align: center;
    }
    .events-section {
        margin: 18px 16px 0 16px;
    }
    .events-heading {
        font-size: 16px;
        font-weight: bold;
        color: #17223B;
        margin: 0 0 10px 4px;
    }
    .events-card {
        background: #FFFFFF;
        border-radius: 20px;
        box-shadow: 0 4px 10px rgba(23,34,59,0.08);
        overflow: hidden;
    }
    .event-row {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #17223B14;
    }
    .event-row:last-child { border-bottom: none; }
    .event-day {
        width: 40px;
        height: 40px;
        min-width: 40px;
        border-radius: 10px;
        border: 1px solid #B00020;
        color: #B00020;
        background: #FDF1F1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: bold;
        margin-right: 14px;
    }
    .event-title {
        font-size: 14px;
        font-weight: bold;
        color: #17223B;
    }
    .events-empty {
        font-size: 13px;
        color: #8A93A8;
        padding: 16px;
        text-align: center;
    }
</style>
</head>
<body>

    <div class="header">
        <p class="title">Calendar</p>
        <p class="subtitle">Stay organized, never miss an important day.</p>
    </div>

    <div class="card">
        <div class="switcher">
            <div class="switch-btn disabled" id="btnPrev" onclick="onPrevMonth()">&#10094;</div>
            <div class="month-label" id="monthLabel">Loading...</div>
            <div class="switch-btn disabled" id="btnNext" onclick="onNextMonth()">&#10095;</div>
        </div>
        <div class="weekdays">
            <div class="weekday sun">Sun</div>
            <div class="weekday">Mon</div>
            <div class="weekday">Tue</div>
            <div class="weekday">Wed</div>
            <div class="weekday">Thu</div>
            <div class="weekday">Fri</div>
            <div class="weekday sat">Sat</div>
        </div>
        <div class="grid" id="calendarGrid">
            <div class="loading-text" id="loadingText">Loading calendar...</div>
        </div>
    </div>

    <div class="events-section">
        <p class="events-heading">This month's events</p>
        <div class="events-card" id="eventsCard"></div>
    </div>

<script>
    var CALENDAR_JSON_FILE = "2083.json";
    var HOLIDAY_JSON_FILE = "holiday.json";
    var FESTIVAL_JSON_FILE = "festival.json";

    // Default: Saturday(6) and Sunday(0) are holidays. Overwritten once holiday.json loads.
    var weeklyHolidays = [0, 6];

    // Populated once festival.json loads. Keyed by "month-day", e.g. "1-1".
    var festivalsByMonthDay = {};

    var MONTH_NAMES = [
        "Baisakh", "Jestha", "Ashadh", "Shrawan", "Bhadra", "Ashoj",
        "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"
    ];

    var dateEntries = [];
    var byNepaliDate = {};

    var displayedYear = 0;
    var displayedMonth = 1;

    var todayYear = 0;
    var todayMonth = 0;
    var todayDay = 0;

    function parseNepaliDate(str) {
        var parts = str.split('-');
        return { year: parseInt(parts[0], 10), month: parseInt(parts[1], 10), day: parseInt(parts[2], 10) };
    }

    function daysInMonthForYear(year, month) {
        var count = 0;
        for (var i = 0; i < dateEntries.length; i++) {
            var d = parseNepaliDate(dateEntries[i].nepali_date);
            if (d.year === year && d.month === month) count++;
        }
        return count;
    }

    function monthName(month) {
        var idx = Math.min(Math.max(month - 1, 0), MONTH_NAMES.length - 1);
        return MONTH_NAMES[idx];
    }

    function pad2(n) {
        return n < 10 ? '0' + n : '' + n;
    }

    function festivalKey(month, day) {
        return month + '-' + day;
    }

    function festivalFor(month, day) {
        return festivalsByMonthDay[festivalKey(month, day)] || null;
    }

    function festivalsForMonth(month) {
        var list = [];
        for (var key in festivalsByMonthDay) {
            if (!festivalsByMonthDay.hasOwnProperty(key)) continue;
            var f = festivalsByMonthDay[key];
            if (f.month === month) list.push(f);
        }
        list.sort(function(a, b) { return a.day - b.day; });
        return list;
    }

    function entryFor(year, month, day) {
        var key = year + '-' + pad2(month) + '-' + pad2(day);
        return byNepaliDate[key] || null;
    }

    function engDayFor(year, month, day) {
        var entry = entryFor(year, month, day);
        if (!entry) return '';
        var parts = entry.english_date.split('-');
        return parseInt(parts[2], 10).toString();
    }

    function weekdayFor(year, month, day) {
        var entry = entryFor(year, month, day);
        if (!entry) return 0;
        var d = new Date(entry.english_date + 'T00:00:00Z');
        return d.getUTCDay();
    }

    function renderMonth() {
        document.getElementById('monthLabel').textContent = monthName(displayedMonth) + ' ' + displayedYear;

        var totalDays = daysInMonthForYear(displayedYear, displayedMonth);
        var firstDay = weekdayFor(displayedYear, displayedMonth, 1);
        var grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        var totalCells = firstDay + totalDays;
        var totalRows = Math.ceil(totalCells / 7);

        var dayCounter = 1;
        for (var r = 0; r < totalRows; r++) {
            for (var c = 0; c < 7; c++) {
                var cellIndex = r * 7 + c;
                if (cellIndex < firstDay || dayCounter > totalDays) {
                    var empty = document.createElement('div');
                    empty.className = 'cell empty';
                    grid.appendChild(empty);
                } else {
                    var day = dayCounter;
                    var isToday = (displayedYear === todayYear && displayedMonth === todayMonth && day === todayDay);
                    var isWeeklyHoliday = weeklyHolidays.indexOf(c) !== -1;
                    var festival = festivalFor(displayedMonth, day);
                    grid.appendChild(buildDayCell(day, isToday, isWeeklyHoliday, festival));
                    dayCounter++;
                }
            }
        }

        renderMonthEvents();
    }

    function buildDayCell(day, isToday, isWeeklyHoliday, festival) {
        var cell = document.createElement('div');

        var classes = 'cell';
        if (isToday) classes += ' today';
        else if (festival) classes += ' festival-day';
        else if (isWeeklyHoliday) classes += ' weekend-holiday';
        cell.className = classes;

        var numSpan = document.createElement('span');
        numSpan.textContent = day;
        cell.appendChild(numSpan);

        var engSpan = document.createElement('span');
        engSpan.className = 'eng-date';
        engSpan.textContent = engDayFor(displayedYear, displayedMonth, day);
        cell.appendChild(engSpan);

        return cell;
    }

    function renderMonthEvents() {
        var eventsCard = document.getElementById('eventsCard');
        eventsCard.innerHTML = '';

        var monthFestivals = festivalsForMonth(displayedMonth);

        if (monthFestivals.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'events-empty';
            empty.textContent = 'No events this month';
            eventsCard.appendChild(empty);
            return;
        }

        for (var i = 0; i < monthFestivals.length; i++) {
            var f = monthFestivals[i];

            var row = document.createElement('div');
            row.className = 'event-row';

            var dayBadge = document.createElement('div');
            dayBadge.className = 'event-day';
            dayBadge.textContent = f.day;
            row.appendChild(dayBadge);

            var titleSpan = document.createElement('span');
            titleSpan.className = 'event-title';
            titleSpan.textContent = f.title;
            row.appendChild(titleSpan);

            eventsCard.appendChild(row);
        }
    }

    function onPrevMonth() {
        displayedMonth -= 1;
        if (displayedMonth < 1) {
            displayedMonth = 12;
            displayedYear -= 1;
        }
        renderMonth();
    }

    function onNextMonth() {
        displayedMonth += 1;
        if (displayedMonth > 12) {
            displayedMonth = 1;
            displayedYear += 1;
        }
        renderMonth();
    }

    function showError(message) {
        document.getElementById('monthLabel').textContent = 'Error';
        var grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        var errorDiv = document.createElement('div');
        errorDiv.className = 'loading-text';
        errorDiv.textContent = message;
        grid.appendChild(errorDiv);
    }

    function findTodayEntry() {
        var todayStr = new Date().toISOString().split('T')[0];
        for (var i = 0; i < dateEntries.length; i++) {
            if (dateEntries[i].english_date === todayStr) return dateEntries[i];
        }
        return dateEntries.length > 0 ? dateEntries[0] : null;
    }

    function startCalendar() {
        if (dateEntries.length === 0) {
            showError('Calendar data unavailable');
            return;
        }

        var todayEntry = findTodayEntry();
        if (!todayEntry) {
            showError('Calendar data unavailable');
            return;
        }

        var todayParsed = parseNepaliDate(todayEntry.nepali_date);
        todayYear = todayParsed.year;
        todayMonth = todayParsed.month;
        todayDay = todayParsed.day;

        displayedYear = todayYear;
        displayedMonth = todayMonth;

        document.getElementById('btnPrev').classList.remove('disabled');
        document.getElementById('btnNext').classList.remove('disabled');

        renderMonth();
    }

    function loadHolidayJson(onDone) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', HOLIDAY_JSON_FILE, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200 || xhr.status === 0) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data && Array.isArray(data.weeklyHolidays)) {
                            weeklyHolidays = data.weeklyHolidays;
                        }
                    } catch (e) {
                        // Keep default weeklyHolidays on parse failure
                    }
                }
                onDone();
            }
        };
        xhr.onerror = function() {
            // Keep default weeklyHolidays if holiday.json can't be fetched
            onDone();
        };
        xhr.send();
    }

    function loadFestivalJson(onDone) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', FESTIVAL_JSON_FILE, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200 || xhr.status === 0) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        festivalsByMonthDay = {};
                        if (data && Array.isArray(data.festivals)) {
                            for (var i = 0; i < data.festivals.length; i++) {
                                var f = data.festivals[i];
                                festivalsByMonthDay[festivalKey(f.month, f.day)] = f;
                            }
                        }
                    } catch (e) {
                        // Keep festivalsByMonthDay empty on parse failure
                    }
                }
                onDone();
            }
        };
        xhr.onerror = function() {
            // Keep festivalsByMonthDay empty if festival.json can't be fetched
            onDone();
        };
        xhr.send();
    }

    function loadCalendarJson() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', CALENDAR_JSON_FILE, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200 || xhr.status === 0) {
                    try {
                        dateEntries = JSON.parse(xhr.responseText);
                        byNepaliDate = {};
                        for (var i = 0; i < dateEntries.length; i++) {
                            byNepaliDate[dateEntries[i].nepali_date] = dateEntries[i];
                        }
                        startCalendar();
                    } catch (e) {
                        showError('Failed to parse calendar data');
                    }
                } else {
                    showError('Failed to load calendar (status ' + xhr.status + ')');
                }
            }
        };
        xhr.onerror = function() {
            showError('Network error loading calendar');
        };
        xhr.send();
    }

    loadHolidayJson(function() {
        loadFestivalJson(loadCalendarJson);
    });
</script>
</body>
</html>
